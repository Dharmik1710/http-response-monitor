# One-click deploy: Render Blueprint → New → Blueprint → connect repo
# https://render.com/docs/blueprint-spec

databases:
  - name: http-monitor-db
    plan: free
    databaseName: http_monitor
    user: monitor

services:
  - type: redis
    name: http-monitor-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: http-monitor-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: monolith
      - key: DATABASE_URL
        fromDatabase:
          name: http-monitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: http-monitor-redis
          property: connectionString
      # 2 min pings so reviewers see data quickly (use 300000 for real prod)
      - key: PING_INTERVAL_MS
        value: "120000"
      - key: HTTPBIN_URL
        value: https://httpbin.org/anything
      # After deploy: set to frontend URL, e.g. https://http-monitor-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: http-monitor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: http-monitor-api
          envVarKey: RENDER_EXTERNAL_URL
